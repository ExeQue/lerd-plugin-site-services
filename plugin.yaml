api_version: 1
name: site-services
lerd: ">=1.38"
version: 0.1.0
description: A site tab that describes every service the site uses
docs: DOCS.md
icon: ui/icon.svg
screenshots: [docs/tab.png]

api:
  - {path: services, methods: [GET], run: bin/services}

mcp:
  tools:
    - name: list
      description: >-
        The lerd services a site uses, each with its status, category, description,
        default login (user / password) and the address it is reached on: its own
        domain when lerd serves it on one, else localhost and its port.
      input_schema:
        type: object
        required: [site]
        properties:
          site: {type: string, description: "Site name, as lerd's site list gives it"}
      run: bin/services

requires: [python3]

ui:
  site_tab: {title: Services, entry: ui/site.html}
